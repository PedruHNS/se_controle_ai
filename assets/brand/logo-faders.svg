<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Se Controle Aí">
  <title>Se Controle Aí — controles</title>
  <defs>
    <!-- userSpaceOnUse para os recortes dos punhos casarem com o fundo. -->
    <linearGradient id="fadersBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#6E5CFF"/>
      <stop offset="1" stop-color="#4326D9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#fadersBg)"/>

  <g fill="#FFFFFF">
    <!-- Trilho: o teto do mês. -->
    <g opacity=".26">
      <rect x="128" y="158" width="256" height="36" rx="18"/>
      <rect x="128" y="238" width="256" height="36" rx="18"/>
      <rect x="128" y="318" width="256" height="36" rx="18"/>
    </g>
    <!-- Preenchimento: o gasto. Encurtando linha a linha. -->
    <rect x="128" y="158" width="196" height="36" rx="18"/>
    <rect x="128" y="238" width="142" height="36" rx="18"/>
    <rect x="128" y="318" width="88" height="36" rx="18"/>
  </g>

  <!-- O punho é vazado no fundo: sem isso ele some dentro do branco. -->
  <g fill="url(#fadersBg)">
    <circle cx="324" cy="176" r="33"/>
    <circle cx="270" cy="256" r="33"/>
    <circle cx="216" cy="336" r="33"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="324" cy="176" r="26"/>
    <circle cx="270" cy="256" r="26"/>
    <circle cx="216" cy="336" r="26"/>
  </g>
</svg>
